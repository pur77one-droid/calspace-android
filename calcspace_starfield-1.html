<body>
<div class="wrap">
  <header class="top"><div class="brand">Calc<span>Space</span></div><div class="tag">Your all-in-one calculator</div></header>
  <main class="layout">
    <section class="card">
      <div class="tabs"><button class="tab active" data-mode="basic">Basic</button><button class="tab" data-mode="scientific">Scientific</button></div>
      <div class="display"><div id="expression">Ready when you are</div><div id="result">0</div></div>
      <div class="keys" id="keys"></div>
      <div class="note">Tip: use your keyboard too. Enter = calculate · Backspace = delete · Esc = clear.</div>
    </section>
    <aside class="card">
      <div class="sidehead"><h2>Recent calculations</h2><button class="clear" id="clearHistory">Clear</button></div>
      <div class="history" id="history"><div class="empty">Your calculations will appear here.</div></div>
    </aside>
  </main>
</div>
<script>
const basic=[
 ['AC','danger'],['DEL','danger'],['%','fn'],['÷','op'],['×','op'],
 ['7',''],['8',''],['9',''],['−','op'],['+','op'],
 ['4',''],['5',''],['6',''],['(','fn'],[')','fn'],
 ['1',''],['2',''],['3',''],['√','fn'],['x²','fn'],
 ['0','zero'],['.',''],['π','fn'],['=','equal']
];
const scientific=[
 ['sin','fn'],['cos','fn'],['tan','fn'],['ln','fn'],['log','fn'],
 ['AC','danger'],['DEL','danger'],['%','fn'],['÷','op'],['×','op'],
 ['7',''],['8',''],['9',''],['−','op'],['+','op'],
 ['4',''],['5',''],['6',''],['(','fn'],[')','fn'],
 ['1',''],['2',''],['3',''],['√','fn'],['x²','fn'],
 ['0','zero'],['.',''],['π','fn'],['^','op'],['=','equal']
];
let expr='',justSolved=false,mode='basic',history=[];
const $=id=>document.getElementById(id), result=$('result'), expression=$('expression');
function render(){result.textContent=expr||'0';}
function add(v){
 if(v==='AC'){expr='';expression.textContent='Ready when you are';render();return}
 if(v==='DEL'){expr=expr.slice(0,-1);render();return}
 if(v==='='){calculate();return}
 if(['sin','cos','tan','ln','log'].includes(v)){expr+=v+'(';justSolved=false;render();return}
 if(v==='√'){expr+='sqrt(';justSolved=false;render();return}
 if(v==='x²'){expr+='^2';justSolved=false;render();return}
 if(v==='π'){expr+='π';justSolved=false;render();return}
 if(v==='×')v='*'; if(v==='÷')v='/'; if(v==='−')v='-';
 if(v==='%')v='%';
 if(justSolved && /[0-9.(π]/.test(v)){expr='';}
 expr+=v;justSolved=false;render();
}
function safeEval(source){
 let s=source.replace(/π/g,'Math.PI').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)')
 .replace(/\^/g,'**')
 .replace(/\bsqrt\(/g,'Math.sqrt(').replace(/\bsin\(/g,'Math.sin(Math.PI/180*')
 .replace(/\bcos\(/g,'Math.cos(Math.PI/180*').replace(/\btan\(/g,'Math.tan(Math.PI/180*')
 .replace(/\bln\(/g,'Math.log(').replace(/\blog\(/g,'Math.log10(');
 if(!/^[0-9+\-*/().,\sA-Za-z_*]+$/.test(s) || /(?:constructor|window|document|alert|eval|Function)/i.test(s)) throw Error('Invalid expression');
 const value=Function('"use strict";return ('+s+')')();
 if(typeof value!=='number'||!Number.isFinite(value))throw Error('Math error');
 return Number.parseFloat(value.toPrecision(12));
}
function calculate(){
 if(!expr)return;
 try{const old=expr, val=safeEval(expr);expr=String(val);expression.textContent=old+' =';justSolved=true;history.unshift({old,val});history=history.slice(0,30);renderHistory();render();}
 catch(e){expression.textContent=e.message==='Math error'?'Cannot calculate this expression':'Check your expression';}
}
function renderHistory(){
 const h=$('history');h.innerHTML='';
 if(!history.length){h.innerHTML='<div class="empty">Your calculations will appear here.</div>';return}
 history.forEach(item=>{const d=document.createElement('div');d.className='item';const a=document.createElement('div'),b=document.createElement('div');a.className='old';b.className='new';a.textContent=item.old;b.textContent='= '+item.val;d.append(a,b);d.addEventListener('click',()=>{expr=String(item.val);expression.textContent='Reused result';justSolved=true;render()});h.append(d)});
}
function build(){const k=$('keys');k.innerHTML='';(mode==='basic'?basic:scientific).forEach(([v,c])=>{const b=document.createElement('button');b.className='key '+c;b.textContent=v;b.addEventListener('click',()=>add(v));k.append(b)});document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode))}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{mode=t.dataset.mode;build()}));
$('clearHistory').addEventListener('click',()=>{history=[];renderHistory()});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key==='='){e.preventDefault();calculate()}
 else if(e.key==='Backspace'){add('DEL')}
 else if(e.key==='Escape'){add('AC')}
